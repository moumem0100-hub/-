<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيستم الكافيه - المنيو والشيفتات</title>
    <style>
        :root {
            --bg-offwhite: #FAF6F0;
            --primary-brown: #4A2C2A;
            --accent-caramel: #C89D7C;
            --danger: #D9534F;
            --success: #2E7D32;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-offwhite); color: var(--primary-brown); padding-bottom: 90px; }
        
        header { background: var(--primary-brown); color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; }
        .table-badge { background: var(--accent-caramel); color: #2D1A18; padding: 4px 10px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; }
        .btn-top { background: transparent; border: 1px solid var(--accent-caramel); color: var(--accent-caramel); padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        
        .container { max-width: 700px; margin: 15px auto; padding: 0 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .card { background: #fff; border: 1px solid #EADBC8; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
        .card h3 { font-size: 0.95rem; margin-bottom: 5px; }
        .price { color: var(--accent-caramel); font-weight: bold; margin-bottom: 5px; }
        .stock { font-size: 0.75rem; color: #666; margin-bottom: 8px; }
        .stock.out { color: var(--danger); font-weight: bold; }
        
        .btn { background: var(--primary-brown); color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary-brown); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-top-left-radius: 12px; border-top-right-radius: 12px; }
        .cart-btn { background: var(--accent-caramel); color: #000; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 999; justify-content: center; align-items: center; padding: 15px; }
        .modal-body { background: var(--bg-offwhite); width: 100%; max-width: 450px; border-radius: 12px; padding: 15px; max-height: 85vh; overflow-y: auto; }
        .close { float: left; font-size: 1.5rem; border: none; background: none; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div>
            <h2 style="font-size: 1.1rem;">☕ كافيه أوف وايت & بني</h2>
            <span class="table-badge" id="tbl-num">طاولة: 5</span>
        </div>
        <div>
            <button class="btn-top" onclick="showShift()">📊 تقفيل الشيفت</button>
            <button class="btn-top" onclick="toggleView()" id="view-btn">البارستا</button>
        </div>
    </header>

    <!-- شاشة العميل -->
    <div class="container" id="cust-view">
        <div id="order-status-box"></div>
        <h3 style="margin-bottom: 10px;">المنيو (20 مشروب)</h3>
        <div class="grid" id="menu-grid"></div>
    </div>

    <!-- شاشة البارستا -->
    <div class="container" id="barista-view" style="display:none;">
        <h3>شاشة الطلبات للمطبخ</h3>
        <div id="barista-list" style="margin-top:10px;">لا يوجد طلبات حالية.</div>
    </div>

    <!-- شريط السلة السفلي -->
    <div class="cart-bar" id="cart-bar">
        <div>العناصر: <b id="c-count">0</b> | الإجمالي: <b id="c-total">0</b> ج.م</div>
        <button class="cart-btn" onclick="openCart()">مراجعة والطلب 🛒</button>
    </div>

    <!-- نافذة السلة -->
    <div class="modal" id="cart-modal">
        <div class="modal-body">
            <button class="close" onclick="closeCart()">&times;</button>
            <h3>سلة الطلبات</h3>
            <div id="cart-items" style="margin: 10px 0;"></div>
            <label style="font-size: 0.85rem;">السكر:</label>
            <select id="sugar" style="width:100%; padding: 6px; margin-bottom: 10px;">
                <option>بدون سكر</option>
                <option selected>مضبوط</option>
                <option>زيادة</option>
            </select>
            <label style="font-size: 0.85rem;">طريقة الدفع:</label>
            <select id="pay" style="width:100%; padding: 6px; margin-bottom: 15px;">
                <option>كاش</option>
                <option>محفظة / كارت</option>
            </select>
            <button class="btn" style="background:var(--accent-caramel); color:#000;" onclick="sendOrder()">تأكيد وإرسال الطلب</button>
        </div>
    </div>

    <!-- نافذة الشيفت -->
    <div class="modal" id="shift-modal">
        <div class="modal-body">
            <button class="close" onclick="closeShift()">&times;</button>
            <h3>تقرير تقفيل الشيفت (8 ساعات)</h3>
            <div style="margin: 15px 0; line-height: 1.8;">
                <p>إجمالي المبيعات: <b id="s-total">0</b> ج.م</p>
                <p>عدد الطلبات: <b id="s-orders">0</b></p>
                <p>مبيعات الكاش: <b id="s-cash">0</b> ج.م</p>
                <p>مبيعات المحفظة/الكارت: <b id="s-card">0</b> ج.م</p>
            </div>
            <button class="btn" style="background:var(--danger);" onclick="resetShift()">تقفيل الشيفت وإعادة ضبط المخزون 🔒</button>
        </div>
    </div>

    <script>
        const drinks = [
            { id: 1, name: "إسبريسو سينجل", price: 35, stock: 30 },
            { id: 2, name: "إسبريسو دبل", price: 45, stock: 30 },
            { id: 3, name: "أمريكانو", price: 40, stock: 30 },
            { id: 4, name: "كابتشينو", price: 55, stock: 30 },
            { id: 5, name: "لاتيه", price: 55, stock: 30 },
            { id: 6, name: "سبانيش لاتيه", price: 65, stock: 30 },
            { id: 7, name: "فلات وايت", price: 60, stock: 30 },
            { id: 8, name: "موكا دافئة", price: 65, stock: 30 },
            { id: 9, name: "كورتادو", price: 50, stock: 30 },
            { id: 10, name: "هوت شوكليت", price: 60, stock: 30 },
            { id: 11, name: "آيس أمريكانو", price: 45, stock: 30 },
            { id: 12, name: "آيس لاتيه", price: 60, stock: 30 },
            { id: 13, name: "آيس سبانيش لاتيه", price: 70, stock: 30 },
            { id: 14, name: "آيس موكا", price: 70, stock: 30 },
            { id: 15, name: "فرابوتشينو كراميل", price: 75, stock: 30 },
            { id: 16, name: "شاي أحمر", price: 25, stock: 30 },
            { id: 17, name: "شاي أخضر", price: 25, stock: 30 },
            { id: 18, name: "عصير برتقال", price: 45, stock: 30 },
            { id: 19, name: "ليمون نعناع", price: 40, stock: 30 },
            { id: 20, name: "موهيتو بلوبيري", price: 65, stock: 30 }
        ];

        let cart = [];
        let orders = [];

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            drinks.forEach(d => {
                const out = d.stock <= 0;
                grid.innerHTML += `
                    <div class="card">
                        <h3>${d.name}</h3>
                        <div class="price">${d.price} ج.م</div>
                        <div class="stock ${out?'out':''}">${out?'نفد': 'المتبقي: '+d.stock}</div>
                        <button class="btn" onclick="add(${d.id})" ${out?'disabled':''}>${out?'غير متوفر':'+ إضافة'}</button>
                    </div>
                `;
            });
        }

        function add(id) {
            const d = drinks.find(item => item.id === id);
            if(d && d.stock > 0) {
                cart.push(d);
                updateCart();
            }
        }

        function updateCart() {
            document.getElementById('c-count').innerText = cart.length;
            const total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('c-total').innerText = total;
        }

        function openCart() {
            if(cart.length === 0) return alert("السلة فارغة");
            const div = document.getElementById('cart-items');
            div.innerHTML = cart.map(i => `<div style="padding:4px 0;">${i.name} - ${i.price} ج.م</div>`).join('');
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

        function sendOrder() {
            cart.forEach(item => { item.stock--; });
            const ord = {
                id: Date.now().toString().slice(-4),
                total: cart.reduce((s, i) => s + i.price, 0),
                pay: document.getElementById('pay').value,
                items: cart.map(i => i.name).join(', ')
            };
            orders.push(ord);
            cart = [];
            updateCart();
            closeCart();
            renderMenu();
            renderBarista();
            alert("تم إرسال طلبك للبارستا بنجاح!");
        }

        function toggleView() {
            const cv = document.getElementById('cust-view');
            const bv = document.getElementById('barista-view');
            const cb = document.getElementById('cart-bar');
            if(bv.style.display === 'none') {
                bv.style.display = 'block'; cv.style.display = 'none'; cb.style.display = 'none';
            } else {
                bv.style.display = 'none'; cv.style.display = 'block'; cb.style.display = 'flex';
            }
        }

        function renderBarista() {
            const list = document.getElementById('barista-list');
            if(orders.length === 0) { list.innerHTML = "لا يوجد طلبات حالية."; return; }
            list.innerHTML = orders.map(o => `
                <div style="background:#fff; padding:10px; border-radius:8px; margin-bottom:8px; border-right:4px solid var(--accent-caramel);">
                    <b>طلب #${o.id}</b> - المشروبات: ${o.items} | الإجمالي: ${o.total} ج.م (${o.pay})
                </div>
            `).join('');
        }

        function showShift() {
            const total = orders.reduce((s, o) => s + o.total, 0);
            const cash = orders.filter(o => o.pay === 'كاش').reduce((s, o) => s + o.total, 0);
            document.getElementById('s-total').innerText = total;
            document.getElementById('s-orders').innerText = orders.length;
            document.getElementById('s-cash').innerText = cash;
            document.getElementById('s-card').innerText = total - cash;
            document.getElementById('shift-modal').style.display = 'flex';
        }

        function closeShift() { document.getElementById('shift-modal').style.display = 'none'; }

        function resetShift() {
            if(confirm("هل تريد تقفيل الشيفت وإعادة ضبط المخزون لـ 30؟")) {
                orders = [];
                drinks.forEach(d => d.stock = 30);
                renderMenu();
                renderBarista();
                closeShift();
                alert("تم تقفيل الشيفت بنجاح!");
            }
        }

        renderMenu();
    </script>
</body>
</html>
